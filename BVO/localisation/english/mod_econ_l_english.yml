 ECON_decisions:0 "ECONOMIC MANAGEMENT PANEL"
  ECON_decisions_desc:0 "Use this panel to track and manage your economy.\n________________________________________________\nThis economic system is inspired by TNO's, with some extravagant flavours added on top.\n\n§GGDP§! nominal [?ECON_arr_nat_GDP_B^0|^] B, real [?ECON_arr_nat_GDP_B^1|^] B, per capita [?ECON_var_nat_GDP_capita_K|^] K;\n§Gnominal GDP growth§! per month [?ECON_arr_nat_GDP_growth_pct^0|+%], per year [?ECON_arr_nat_GDP_growth_pct^1|+%].\n§OInflation§! per month [?ECON_var_nat_inflation_pct_monthly|%].\nPoverty [?ECON_var_nat_MISC_poverty_K|2] K ([?ECON_var_nat_MISC_poverty_rate_pct|%]) counted as below [?ECON_var_nat_MISC_poverty_income_as_pct_of_GDPC|%] GDP/C\n__\n§GTreasury§! [?ECON_var_nat_RSV_liquid_B|^] B, balance of payment [?ECON_var_nat_RSV_budget_B|+] B\n\n§GIncome§! [?ECON_var_nat_REV_B|^] B\n               §9income tax§!    [?ECON_arr_nat_REV_sources_B^1|^] B rate base [?ECON_arr_nat_REV_tax_rates_pct^1|%] modifier [?ECON_arr_nat_REV_tax_rates_modifier_pct^0|+%] + [?ECON_arr_nat_REV_tax_rates_modifier_pct^1|+%]\n                    (§9poverty§!    [?ECON_arr_nat_REV_sources_B^2|^] B rate base [?ECON_arr_nat_REV_tax_rates_pct^2|%] modifier [?ECON_arr_nat_REV_tax_rates_modifier_pct^0|+%] + [?ECON_arr_nat_REV_tax_rates_modifier_pct^2|+%])\n               §gbusiness tax§! [?ECON_arr_nat_REV_sources_B^3|^] B rate [?ECON_arr_nat_REV_tax_rates_pct^3|%]\n\n§RExpenditures§! [?ECON_var_nat_EXP_B|^] B\n                           §YCivilian§! [?ECON_arr_nat_EXP_sources_B^0|^] B\n                                           Education   [?ECON_arr_nat_EXP_SOCL_B^0|^] B\n                                           Healthcare [?ECON_arr_nat_EXP_SOCL_B^1|^] B\n                                           Pensions     [?ECON_arr_nat_EXP_SOCL_B^2|^] B to [?ECON_var_nat_MISC_pensioners_K|^] K pensioners ([?ECON_var_nat_MISC_pensioners_pct|%])\n                                           Benefits      [?ECON_arr_nat_EXP_SOCL_B^3|^] B to [?ECON_var_nat_MISC_unemployment_K|^] K unemployed ([?ECON_var_nat_MISC_unemployment_pct|%])\n                                           Policing       [?ECON_arr_nat_EXP_SEC_B^5|^] B\n                                           Prison          [?ECON_arr_nat_EXP_SEC_B^6|^] B\n                           §LArmed forces§! [?ECON_arr_nat_EXP_sources_B^1|^] B\n                                         §7Ground§! [?ECON_arr_nat_EXP_military_B^0|^] B\n                                           §6Frontline bns.§!\n                                             Reg inf & inf spt [?ECON_arr_nat_EXP_military_GROUND_sorted_B^0|^] B modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^0|+%]\n                                             Cav, LI & irreg     [?ECON_arr_nat_EXP_military_GROUND_sorted_B^1|^] B modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^1|+%]\n                                             Mtn, mar & para [?ECON_arr_nat_EXP_military_GROUND_sorted_B^2|^] B modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^2|+%]\n                                             Mot & mot spt    [?ECON_arr_nat_EXP_military_GROUND_sorted_B^3|^] B modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^3|+%]\n                                             APC                        [?ECON_arr_nat_EXP_military_GROUND_sorted_B^4|^] B modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^4|+%]\n                                             IFV                          [?ECON_arr_nat_EXP_military_GROUND_sorted_B^5|^] B modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^5|+%]\n                                             MBT                        [?ECON_arr_nat_EXP_military_GROUND_sorted_B^6|^] B modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^6|+%]\n                                           §6Support coys.§!\n                                             Heli spt                 [?ECON_arr_nat_EXP_military_GROUND_sorted_B^7|^] B modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^7|+%]\n                                             Other spt              [?ECON_arr_nat_EXP_military_GROUND_sorted_B^8|^] B modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^8|+%]\n\n§tInterest rate§! [?ECON_var_nat_EXP_interest_pct|%]\n__\n§GProduction units§! [?ECON_var_nat_PU_total], §6conversion threshold§! [?ECON_var_nat_PU_threshold_B|] B, §Oconsumer goods factor§! [?ECON_arr_nat_PU_consumer_goods_pct^0|%].\nAllocation consumer goods §O[?ECON_arr_nat_PU_assignment^5]§! unallocated §G[?ECON_arr_nat_PU_assignment^0]§! civilian §Y[?ECON_arr_nat_PU_assignment^2]§! military §6[?ECON_arr_nat_PU_assignment^3]§! dockyards §3[?ECON_arr_nat_PU_assignment^4]§!\n\n[?ECON_arr_nat_EXP_military_GROUND_sorted_B^0] [?POLICIES_arr_nat_ARM_sorted_units^0]  [?ECON_arr_nat_EXP_military_GROUND_sorted_B^1] [?POLICIES_arr_nat_ARM_sorted_units^1]  [?ECON_arr_nat_EXP_military_GROUND_sorted_B^2] [?POLICIES_arr_nat_ARM_sorted_units^2]  [?ECON_arr_nat_EXP_military_GROUND_sorted_B^3] [?POLICIES_arr_nat_ARM_sorted_units^3]  [?ECON_arr_nat_EXP_military_GROUND_sorted_B^4] [?POLICIES_arr_nat_ARM_sorted_units^4]  [?ECON_arr_nat_EXP_military_GROUND_sorted_B^5] [?POLICIES_arr_nat_ARM_sorted_units^5]  [?ECON_arr_nat_EXP_military_GROUND_sorted_B^6] [?POLICIES_arr_nat_ARM_sorted_units^6]\n[?ECON_arr_nat_EXP_military_GROUND_sorted_B^7] [?POLICIES_arr_nat_ARM_sorted_units^7]  [?ECON_arr_nat_EXP_military_GROUND_sorted_B^8] [?POLICIES_arr_nat_ARM_sorted_units^8] "
  
