l_english:
 ECON_decisions:0 "ECONOMIC MANAGEMENT PANEL"
  ECON_decisions_desc:0 "Use this panel to track and manage your economy.\n________________________________________________\nThis economic system is inspired by TNO's, with some extravagant flavours added on top.\n\n§GGDP§! nominal [?ECON_arr_nat_GDP_B^0|^] B, real [?ECON_arr_nat_GDP_B^1|^] B, per capita [?ECON_var_nat_GDP_capita_K|^] K;\n§Gnominal GDP growth§! per month [?ECON_arr_nat_GDP_growth_pct^0|+%], per year [?ECON_arr_nat_GDP_growth_pct^1|+%].\n§OInflation§! per month [?ECON_var_nat_inflation_pct_monthly|%].\nPoverty [?ECON_var_nat_MISC_poverty_K|2] K ([?ECON_var_nat_MISC_poverty_rate_pct|%]) counted as below [?ECON_var_nat_MISC_poverty_income_as_pct_of_GDPC|%] GDP/C\n__\n§GTreasury§! [?ECON_var_nat_RSV_liquid_B|^] B, monthly balance of payment [?ECON_var_nat_RSV_budget_B|+] B ([?ECON_var_nat_RSV_budget_per_GDP_pct|+%] GDP)\n§tInterest§! [?ECON_arr_nat_EXP_sources_B^2|^] B rate [?ECON_var_nat_EXP_interest_pct|%] \nDeficit spending growth bonus (applied if green) [?ECON_var_nat_RSV_deficit_spending_GDP_bonus_pct|+%]\n__\n§GProduction units§! [?ECON_var_nat_PU_total], §6conversion threshold§! [?ECON_var_nat_PU_threshold_B|] B, §Oconsumer goods factor§! [?ECON_arr_nat_PU_consumer_goods_pct^0|%].\nAllocation consumer goods §O[?ECON_arr_nat_PU_assignment^5]§! unallocated §G[?ECON_arr_nat_PU_assignment^0]§! civilian §Y[?ECON_arr_nat_PU_assignment^2]§! military §6[?ECON_arr_nat_PU_assignment^3]§! dockyards §3[?ECON_arr_nat_PU_assignment^4]§!\n\n[?ECON_var_nat_RSV_budget_per_GDP_pct] [?ECON_var_nat_RSV_deficit_spending_GDP_bonus_pct]  [?ECON_arr_nat_GDP_growth_pct^1] [?ECON_arr_nat_GDP_growth_pct^0]"
 
 ECON_decision_LOC_income:0 "§GIncome§! §W[?ECON_var_nat_REV_B|^] B§!"
  ECON_decision_LOC_income_desc:0 "§9Income tax§!   §W[?ECON_arr_nat_REV_sources_B^1|^] B§! rate base [?ECON_arr_nat_REV_tax_rates_pct^1|%]\n                    modifier [?ECON_arr_nat_REV_tax_rates_modifier_pct^0|+%] + [?ECON_arr_nat_REV_tax_rates_modifier_pct^1|+%]\n§9Poverty ic. t.§! §W[?ECON_arr_nat_REV_sources_B^2|^] B§! rate base [?ECON_arr_nat_REV_tax_rates_pct^2|%]\n                    modifier [?ECON_arr_nat_REV_tax_rates_modifier_pct^0|+%] + [?ECON_arr_nat_REV_tax_rates_modifier_pct^2|+%]\n§gBusiness tax§! §W[?ECON_arr_nat_REV_sources_B^3|^] B§! rate [?ECON_arr_nat_REV_tax_rates_pct^3|%]"
 ECON_decision_LOC_expenditures:0 "§RExpenditures§! §W[?ECON_var_nat_EXP_B|^] B§!"
  ECON_decision_LOC_expenditures_desc:0 "§YCivilian§! §W[?ECON_arr_nat_EXP_sources_B^0|^] B§!\n     Education   §W[?ECON_arr_nat_EXP_SOCL_B^0|^] B§!\n     Healthcare §W[?ECON_arr_nat_EXP_SOCL_B^1|^] B§!\n     Pensions     §W[?ECON_arr_nat_EXP_SOCL_B^2|^] B§! to [?ECON_var_nat_MISC_pensioners_K|^] K ([?ECON_var_nat_MISC_pensioners_pct|%] pop.)\n     Benefits       §W[?ECON_arr_nat_EXP_SOCL_B^3|^] B§! to [?ECON_var_nat_MISC_unemployment_K|^] K ([?ECON_var_nat_MISC_unemployment_pct|%] pop.)\n     Policing       §W[?ECON_arr_nat_EXP_SEC_B^5|^] B§!\n     Prison          §W[?ECON_arr_nat_EXP_SEC_B^6|^] B§!\n§LArmed forces§! §W[?ECON_arr_nat_EXP_sources_B^1|^] B§!\n     §7Ground§! §W[?ECON_arr_nat_EXP_military_B^0|^] B§!\n          §6Frontline bns.§!\n               Reg inf & inf spt  §W[?ECON_arr_nat_EXP_military_GROUND_sorted_B^0|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^0|+%]\n               Cav, LI & irreg     §W[?ECON_arr_nat_EXP_military_GROUND_sorted_B^1|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^1|+%]\n               Mtn, mar & para §W[?ECON_arr_nat_EXP_military_GROUND_sorted_B^2|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^2|+%]\n               Mot & mot spt      §W[?ECON_arr_nat_EXP_military_GROUND_sorted_B^3|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^3|+%]\n               APC                     §W[?ECON_arr_nat_EXP_military_GROUND_sorted_B^4|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^4|+%]\n               IFV                       §W[?ECON_arr_nat_EXP_military_GROUND_sorted_B^5|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^5|+%]\n               MBT                     §W[?ECON_arr_nat_EXP_military_GROUND_sorted_B^6|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^6|+%]\n          §6Support coys.§!\n               Heli spt                §W[?ECON_arr_nat_EXP_military_GROUND_sorted_B^7|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^7|+%]\n               Other spt             §W[?ECON_arr_nat_EXP_military_GROUND_sorted_B^8|^] B§!\n                     modifier[?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_unit_modifier_pct^8|+%]\n     §7Naval§! §W[?ECON_arr_nat_EXP_military_B^1|^] B§!\n               SS                        §W[?ECON_arr_nat_EXP_military_NAVAL_sorted_B^0|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_ships_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_ships_modifier_pct^0|+%]\n               FS & FF                 §W[?ECON_arr_nat_EXP_military_NAVAL_sorted_B^1|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_ships_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_ships_modifier_pct^1|+%]\n               DD                       §W[?ECON_arr_nat_EXP_military_NAVAL_sorted_B^2|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_ships_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_ships_modifier_pct^2|+%]\n               CG                      §W[?ECON_arr_nat_EXP_military_NAVAL_sorted_B^3|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_ships_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_ships_modifier_pct^3|+%]\n               BC & BB               §W[?ECON_arr_nat_EXP_military_NAVAL_sorted_B^4|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_ships_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_ships_modifier_pct^4|+%]\n               CV                       §W[?ECON_arr_nat_EXP_military_NAVAL_sorted_B^5|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_ships_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_ships_modifier_pct^5|+%]\n     §7Aerial§! §W[?ECON_arr_nat_EXP_military_B^2|^] B§!\n               Ftr                        §W[?ECON_arr_nat_EXP_military_AIR_sorted_B^0|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_air_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_air_modifier_pct^0|+%]\n               Atk                      §W[?ECON_arr_nat_EXP_military_AIR_sorted_B^1|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_air_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_air_modifier_pct^1|+%]\n               Int                        §W[?ECON_arr_nat_EXP_military_AIR_sorted_B^2|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_air_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_air_modifier_pct^2|+%]\n               Nav                      §W[?ECON_arr_nat_EXP_military_AIR_sorted_B^3|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_air_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_air_modifier_pct^3|+%]\n               Mult                      §W[?ECON_arr_nat_EXP_military_AIR_sorted_B^4|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_air_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_air_modifier_pct^4|+%]\n               Tac                       §W[?ECON_arr_nat_EXP_military_AIR_sorted_B^5|^] B§!\n                    modifier [?POLICIES_arr_nat_ARM_spending_air_modifier_pct^99|+%] + [?POLICIES_arr_nat_ARM_spending_air_modifier_pct^5|+%]\n               Strat                      §W[?ECON_arr_nat_EXP_military_AIR_sorted_B^6|^] B§!