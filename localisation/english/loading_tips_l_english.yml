l_english:
 LOADING_TIP_0: "Such is life in Glorious Arstotzka"
 LOADING_TIP_1: "Arise, ye workers from ye slumbers,\nArise, ye prisoners of want!\n — L'Internationale"
 LOADING_TIP_2: "Every soldier must know, before he goes into battle, how the little battle he is to fight fits into the larger picture.\n — Bernard L. Montgomery"
 LOADING_TIP_3: "If we lose the war in the air we lose the war and we lose it quickly.\n — Bernard L. Montgomery"
 LOADING_TIP_4: "The guerilla wins if he doesn't lose. The conventional army loses if it doesn't win\n — Henry Kissinger"
 LOADING_TIP_5: "From a philosophical and doctrinal viewpoint, I do not believe in perpetual peace.\n — Benito Mussolini"
 LOADING_TIP_6: "Giraffes are heartless creatures"
 LOADING_TIP_7: "As long as there are sovereign nations possessing great power, war is inevitable.\n — Albert Einstein"
 LOADING_TIP_8: "Those who vote decide nothing. Those who count the vote decide everything.\n — Joseph Stalin"
 LOADING_TIP_9: "History shows that there are no invincible armies and that there never have been.\n — Joseph Stalin"
 LOADING_TIP_10: "It would be quite obvious to anyone that the bloody fool carrying the umbrella could only be an Englishman.\n — Digby Tatham-Warter"
 LOADING_TIP_11: "To those who say derogatory things about colonialism, I would say colonialism is a wonderful thing. It spread civilisation to Africa. Before that they had no written language, no wheel as we know it, no schools, no hospitals, not even normal clothing.\n — Ian Smith"
 LOADING_TIP_12: "The only real power comes out of a long rifle.\n — Joseph Stalin"
 LOADING_TIP_13: "All history is man's efforts to realise ideals.\n — Eamon de Valera"
 LOADING_TIP_14: "Let me say it again. I don't believe in black majority rule ever in Rhodesia - not in a thousand years.\n — Ian Smith"
 LOADING_TIP_15: "Partition is after all only an old fortress of crumbled masonry — held together with the plaster of fiction.\n — Eamon de Valera"
 LOADING_TIP_16: "If you tell a big enough lie and tell it frequently enough, it will be believed.\n — Adolf Hitler"
 LOADING_TIP_17: "The wind of change is blowing through this continent. Whether we like it or not, this growth of national consciousness is a political fact.\n — Harold Macmillan"
 LOADING_TIP_18: "Success consists of going from failure to failure without loss of enthusiasm.\n — Winston Churchill"
 LOADING_TIP_19: "If you're going through hell, keep going.\n — Winston Churchill"
 LOADING_TIP_20: "History writes the word 'Reconciliation' all over her quarrels.\n — Jan Smuts"
 LOADING_TIP_21: "Whenever in future wars the battle is fought, panzer troops will play the decisive role.\n — Heinz Guderian"
 LOADING_TIP_22: "If there was to be equal manhood suffrage the whites would be swamped all over South Africa by the blacks and the whole position for which whites have striven for 200 years or more would be given up.\n — Jan Smuts"
 LOADING_TIP_23: "There is still too much of the old division and separation in our national elements, but still the effort has been made, and you see today in South Africa the biggest problem facing us being solved along holistic lines.\n — Jan Smuts (1940)"
 LOADING_TIP_24: "A good plan violently executed now is better than a perfect plan executed next week.\n — George S. Patton"
 LOADING_TIP_25: "Some of you will not come back. Some of you will come back maimed. Those of you who do come back will come back changed men. That is war!\n — Jan Smuts"
 LOADING_TIP_26: "Nobody ever defended anything successfully, there is only attack and attack and attack some more.\n — George S. Patton"
 LOADING_TIP_27: "The idea that the Natives must all be removed and confined in their own kraals is in my opinion the greatest nonsense I have ever heard.\n — Jan Smuts"
 LOADING_TIP_28: "The first time I ever saw a jet, I shot it down.\n — Chuck Yeager, USAAF"
 LOADING_TIP_29: "Theo, Heinrich here. Have just shot down two bombers. No more ammunition. I'm going to ram. Auf Wiedersehen, see you in Valhalla!\n — Heinrich Ehrler, Luftwaffe"
 LOADING_TIP_30: "Leadership consists of picking good men and helping them do their best.\n — Chester W. Nimitz"
 LOADING_TIP_31: "The people who are opposing the policy of apartheid have not the courage of their convictions. They do not marry non-Europeans.\n — P. W. Botha"
 LOADING_TIP_32: "If the principle of permanent residence for the black man in the area of the white is accepted then it is the beginning of the end of civilisation as we know it in this country.\n — P. W. Botha"
 LOADING_TIP_33: "What counts is not necessarily the size of the dog in the fight - it's the size of the fight in the dog.\n — Dwight D. Eisenhower"
 LOADING_TIP_34: "It goes without saying that when survival is threatened, struggles erupt between peoples, and unfortunate wars between nations result.\n — Hideki Tojo"
 LOADING_TIP_35: "In a man-to-man fight, the winner is he who has one more round in his magazine.\n — Erwin Rommel"
 LOADING_TIP_36: "Where in the whole wide world today can you find a more just society than South Africa has?\n — P. W. Botha"
 LOADING_TIP_37: "Sweat saves blood, blood saves lives, but brains saves both.\n — Erwin Rommel"
 LOADING_TIP_38: "Accept where I am going or I will not lead you.\n — P. W. Botha"
 LOADING_TIP_39: "If we dwell on real or imagined sins of the past, we shall never be able to find one another in the present, nor shall we be able to work together on building the future.\n — F. W. de Klerk"
 LOADING_TIP_40: "The Soviet people want full-blooded and unconditional democracy.\n — Mikhail Gorbachev"
 LOADING_TIP_41: "The general line of our party worked out by its 20th, 21st and 22nd congresses is a Leninist line. It was, is and will be the only immutable line in the entire domestic and foreign policy of the Communist party and the Soviet state.\n — Leonid Brezhnev"
 LOADING_TIP_42: "The Soviet Union does not look for advantages, does not hunt for concessions, does not seek political domination and is not after military bases. We act as we are bid by our revolutionary conscience, our communist convictions.\n — Leonid Brezhnev"
 LOADING_TIP_43: "If we come to a minefield, our infantry attacks exactly as if it were not there.\n — Georgy Zhukov"
 LOADING_TIP_44: "I remember hesitating for a long time over the US presidential system. But it wouldn't have done — we were too trained in English democracy to sit down under a dictatorship which is what the American system really is.\n — Eamon de Valera"
 LOADING_TIP_45: "NUTS!\n — Anthony C. McAuliffe, responding to the German demand for surrender"
 LOADING_TIP_46: "My arms are up to the elbows in blood. That is the most terrible thing that lies in my soul.\n — Nikita Khrushchev"
 LOADING_TIP_47: "Whether you like it or not, history is on our side. We will bury you.\n — Nikita Khrushchev"
 LOADING_TIP_48: "Politicians are the same all over. They promise to build a bridge even where there is no river.\n — Nikita Khrushchev"
 LOADING_TIP_49: "Your name unknown, your deed immortal.\n — Tomb of the Unknown Soldier (Moscow)"
 LOADING_TIP_50: "Stalin acted not through persuasion, explanation and patient cooperation with people, but by imposing his concepts and demanding absolute submission to his opinion.\n — Nikita Khrushchev, 'The Cult of the Individual and its Consequences'"
 LOADING_TIP_51: "The Brighton bombing was an inevitable result of the British presence in this country. Far from being a blow against democracy it was a blow for democracy.\n — Gerry Adams"
 LOADING_TIP_52: "Mr. Sands was a convicted criminal. He chose to take his own life. It was a choice that his organisation did not allow to many of its victims.\n — Margaret Thatcher"
 LOADING_TIP_53: "As I stepped out of the van on arrival there they grabbed me from all sides and began punching and kicking me to the ground... they dragged me by the hair across a stretch of hard core rubble to the gate of the punishment block.\n — Bobby Sands (on prison guards)"
 LOADING_TIP_54: "In politics, if you want anything said, ask a man; if you want anything done, ask a woman.\n — Margaret Thatcher"
 LOADING_TIP_55: "Britain therefore must be strong, strong in arms, and strong in faith in her own way of life.\n — Margaret Thatcher"
 LOADING_TIP_56: "You will not be seeing me for three years because to have a visit I have to wear uniform. If they want me to wear a uniform they'll have to nail it to my back.\n — Kierran Nugent"
 LOADING_TIP_57: "Isn't it dreadful? Here we are, two officers of the German General Staff, discussing how best to murder our commander in chief.\n — Henning von Tresckow"
 LOADING_TIP_58: "Give the local councils 100 million each and ask them to defend themselves - we wouldn't have to worry about the Russians, we'd have a civil war in 3 weeks.\n — from Yes, Prime Minister"
 LOADING_TIP_59: "We are not prepared to consider special category status for certain groups of people serving sentences for crime. Crime is crime is crime; it is not political.\n — Margaret Thatcher"
 LOADING_TIP_60: "If Hitler invaded Hell, I would make at least a favorable reference to the devil in the House of Commons.\n — Winston Churchill (21. 06. 1941)"
 LOADING_TIP_61: "So the bastard's dead? Too bad we didn't capture him alive!\n — Joseph Stalin (on hearing of Hitler's suicide)"
 LOADING_TIP_62: "Will anyone here object if, with a ballot paper in this hand, and an Armalite in this hand, we take power in Ireland?\n — Danny Morrison (1981 Sinn Fein Ardfheis)"
 LOADING_TIP_63: "I do not believe that people who go on strike in this country have a legitimate cause. Throughout the period of the Labour Government and this one, I have never supported any strikes in this country.\n — Margaret Thatcher"
 LOADING_TIP_64: "We faced them squarely and we were determined to overcome...What has indeed happened is that now once again Britain is not prepared to be pushed around. We have ceased to be a nation in retreat.\n — Margaret Thatcher"
 LOADING_TIP_65: "The battle for women's rights has been largely won. The days when they were demanded and discussed in strident tones should be gone for ever. And I hope they are.\n — Margaret Thatcher"
 LOADING_TIP_66: "I would say, what is more quintessentially America than coming to a country you don't belong in and deciding you're going to stay?\n — John Oliver"
 LOADING_TIP_67: "It's a way of us completely rewriting our history to give our children and our children's children a much better history to grow up with. We seem to have no intention of providing them with a future.\n — John Oliver"
 LOADING_TIP_68: "I have complete faith in the continued absurdity of whatever’s going on.\n — Jon Stewart"
 LOADING_TIP_69: "We must make it possible for every individual to lead the good life, to win a place in the sun. We are in danger of becoming a race of fear-ridden neurotics – we who live in the finest country on Earth.\n — Garfield Todd"
 LOADING_TIP_70: "Sink, burn, capture, destroy. Let nothing pass.\n — Andrew Cunningham, Battle of Tunisia"
 LOADING_TIP_71: "It is always characteristic of Liberal hypocrisy to pay lip service to these things and refuse to face the consequences that follow from them.\n — Aneuryn Bevan (1930)"
 LOADING_TIP_72: "If you treat Roman Catholics with due consideration and kindness they will live like Protestants in spite of the authoritative nature of their Church.\n — Terence O'Neill"
 LOADING_TIP_73: "You cannot collaborate, you cannot accept the logic of collaboration on a first class issue like rearmament, and at the same time evade the implications of collaboration all along the line when the occasion demands it.\n — Aneuryn Bevan"
 LOADING_TIP_74: "Rules are not necessarily sacred, principles are.\n — Franklin D. Roosevelt"
 LOADING_TIP_75: "People who are hungry and out of a job are the stuff of which dictatorships are made.\n — Franklin D. Roosevelt"
 LOADING_TIP_76: "We ought to take pride in the fact that, despite our financial and economic anxieties, we are still able to do the most civilised thing in the world—put the welfare of the sick in front of every other consideration.\n — Aneuryn Bevan"
 LOADING_TIP_77: "Fortifications, artillery, foreign aid - will be of no value, unless the ordinary soldier knows that it is HE guarding his country.\n — Carl Gustaf Emil Mannerheim"
 LOADING_TIP_78: "Through the mud and the blood to the green fields beyond.\n — Unofficial Canadian Armoured Corps motto"
 LOADING_TIP_79: "The Communist does not look upon a Socialist as an ally in a common cause. He looks upon him as a dupe, as a temporary convenience, and as something to be thrust ruthlessly to one side when he has served his purpose.\n — Aneuryn Bevan"
 LOADING_TIP_80: "And we'll fight them with the butt ends of broken beer bottles because that's bloody well all we've got!\n — Winston Churchill (immediately after promising to fight in the fields and in the streets)"
 LOADING_TIP_81: "Experience has shown that attacks against tanks with close combat weapons by a sufficiently determined man will basically always succeed.\n — German Army Group Center anti-tank manual"
 LOADING_TIP_82: "When we are returned to power we want to put in the statute book an act which will make our people citizens of the world before they are citizens of this country.\n — Clement Attlee"
 LOADING_TIP_83: "Politics is war without bloodshed, while war is politics with bloodshed.\n — Mao Zedong"
 LOADING_TIP_84: "We are a small nation. Our military strength in proportion to the mighty armaments of modern nations can never be considerable. Our strength as a nation will depend upon our economic freedom, and upon our moral and intellectual force. In these we can become a shining light in the world.\n — Michael Collins"
 LOADING_TIP_85: "You will be judged by what you succeed at gentlemen, not by what you attempt.\n — Clement Attlee"
 LOADING_TIP_86: "People don't matter, only what they represent.\n — Ion Antonescu"
 LOADING_TIP_87: "In wartime, truth is so precious that she should always be attended by a bodyguard of lies.\n — Winston Churchill"
 LOADING_TIP_88: "We're not British, we're not Saxon, we're not English. We're Irish and proud we are to be.\n — Thomas Skelly"
 LOADING_TIP_88: "In Ireland the inevitable never happens and the unexpected constantly occurs.\n — Sir John Pentland Mahaffy"
 LOADING_TIP_89: "Karadzicu, vodi Srbe svoje!"
 LOADING_TIP_90: "Every human being makes mistakes.\n — Ian Smith"
 LOADING_TIP_91: "I will cease to exercise my functions as President of the Republic. This decision will take effect today at midday.\n — Charles de Gaulle"
 LOADING_TIP_92: "Our army, if it exists for honorable purposes only, will draw to it honorable men. It will call to it the best men of our race- men of skill and culture. It will not be recruited as so many modern nations are, from those who are industrially useless.\n — Michael Collins"
 LOADING_TIP_93: "For generations, a wide range of shooting in Northern Ireland has provided all sections of the population with a pastime which ... has occupied a great deal of leisure time. Unlike many other countries, the outstanding characteristic of the sport has been that it was not confined to any one class.\n — Northern Ireland Tourist Board (1969)"
 LOADING_TIP_94: "Let us be firm, pure and faithful; at the end of our sorrow, there is the greatest glory of the world, that of the men who did not give in\n — Charles de Gaulle"
 LOADING_TIP_95: "Vanquished today by mechanical force, we will be able to overcome in the future by a superior mechanical force.\n — Charles de Gaulle (18. 06. 1940.)"
 LOADING_TIP_96: "I am not prepared to build the type of wall you built in Berlin. In South Africa we only build walls for houses.\n — P. W. Botha"
 LOADING_TIP_97: "We do not want chaos in South Africa.\n — P. W. Botha, on why cinemas are not open for all races (1983)"
 LOADING_TIP_98: "For God's sake bring me a large Scotch. What a bloody awful country!\n — Reginald Maudling, leaving Belfast"
 LOADING_TIP_99: "Ireland unfree shall never be at peace.\n — Pádraig Pearse (01. 08. 1915.)"
 LOADING_TIP_99: "If you took the word `no' out of the English language, most of them would be speechless.\n — John Hume, on Northern Irish unionists"
 LOADING_TIP_100: "My friend, you would not tell with such high zest/To children ardent for some desperate glory,/The old Lie: Dulce et decorum est/Pro patria mori.\n — Wilfred Owen"